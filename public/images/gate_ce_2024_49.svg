<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <defs>
    <!-- Hatching pattern for fixed support -->
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="2" />
    </pattern>
    <!-- Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>

  <!-- Fixed Support -->
  <line x1="100" y1="50" x2="100" y2="110" stroke="black" stroke-width="3" />
  <rect x="80" y="50" width="20" height="60" fill="url(#hatch)" />

  <!-- Beam PQ (finite EI) -->
  <line x1="100" y1="80" x2="300" y2="80" stroke="black" stroke-width="4" />
  <!-- Beam QR (infinite EI) - Thicker to represent infinite EI -->
  <line x1="300" y1="80" x2="500" y2="80" stroke="black" stroke-width="8" />

  <!-- Labels P, Q, R -->
  <text x="110" y="70" font-family="sans-serif" font-size="20" font-weight="bold">P</text>
  <text x="290" y="70" font-family="sans-serif" font-size="20" font-weight="bold">Q</text>
  <text x="480" y="70" font-family="sans-serif" font-size="20" font-weight="bold">R</text>

  <!-- UDL on QR -->
  <!-- We'll draw several small semicircles or just downward arrows for UDL -->
  <path d="M 300 80 Q 312 60 325 80 Q 337 60 350 80 Q 362 60 375 80 Q 387 60 400 80 Q 412 60 425 80 Q 437 60 450 80 Q 462 60 475 80 Q 487 60 500 80" fill="none" stroke="black" stroke-width="2"/>
  <text x="360" y="50" font-family="sans-serif" font-size="18" font-weight="bold">5 kN/m</text>

  <!-- Dimension lines -->
  <line x1="100" y1="120" x2="100" y2="160" stroke="black" stroke-width="1" />
  <line x1="300" y1="120" x2="300" y2="160" stroke="black" stroke-width="1" />
  <line x1="500" y1="120" x2="500" y2="160" stroke="black" stroke-width="1" />
  
  <line x1="100" y1="140" x2="300" y2="140" stroke="black" stroke-width="1" />
  <path d="M 110 135 L 90 145 M 310 135 L 290 145" stroke="black" stroke-width="2" />
  <text x="180" y="160" font-family="sans-serif" font-size="18">3 m</text>
  
  <line x1="300" y1="140" x2="500" y2="140" stroke="black" stroke-width="1" />
  <path d="M 310 135 L 290 145 M 510 135 L 490 145" stroke="black" stroke-width="2" />
  <text x="380" y="160" font-family="sans-serif" font-size="18">3 m</text>

  <text x="250" y="190" font-family="sans-serif" font-size="14" fill="#0066cc" font-weight="bold">(Figure NOT to scale)</text>
</svg>

<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <defs>
    <!-- Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>

  <!-- Left: Column Section -->
  <rect x="150" y="80" width="150" height="250" fill="white" stroke="black" stroke-width="3" />
  
  <!-- Rebar circles -->
  <circle cx="180" cy="110" r="10" fill="black" />
  <circle cx="225" cy="110" r="10" fill="black" />
  <circle cx="270" cy="110" r="10" fill="black" />
  
  <circle cx="180" cy="300" r="10" fill="black" />
  <circle cx="225" cy="300" r="10" fill="black" />
  <circle cx="270" cy="300" r="10" fill="black" />

  <!-- Dimensions for B=300mm -->
  <line x1="150" y1="70" x2="150" y2="40" stroke="black" stroke-width="1" />
  <line x1="300" y1="70" x2="300" y2="40" stroke="black" stroke-width="1" />
  <line x1="150" y1="50" x2="300" y2="50" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="180" y="40" font-family="sans-serif" font-size="16">B = 300 mm</text>

  <!-- Dimensions for D=500mm -->
  <line x1="140" y1="80" x2="100" y2="80" stroke="black" stroke-width="1" />
  <line x1="140" y1="330" x2="100" y2="330" stroke="black" stroke-width="1" />
  <line x1="120" y1="80" x2="120" y2="330" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="30" y="210" font-family="sans-serif" font-size="16">D = 500 mm</text>

  <text x="180" y="370" font-family="sans-serif" font-size="16">Column section</text>

  <!-- Right: Strain Distribution -->
  <!-- Neutral Axis level -->
  <line x1="320" y1="330" x2="580" y2="330" stroke="black" stroke-width="2" stroke-dasharray="5,5" />
  
  <!-- Strain triangle -->
  <line x1="450" y1="80" x2="450" y2="380" stroke="black" stroke-width="3" />
  
  <line x1="450" y1="80" x2="550" y2="80" stroke="black" stroke-width="3" />
  
  <line x1="550" y1="80" x2="420" y2="380" stroke="black" stroke-width="3" />

  <line x1="450" y1="380" x2="420" y2="380" stroke="black" stroke-width="2" stroke-dasharray="5,5" />

  <!-- Dimensions for xu=1.1D -->
  <line x1="440" y1="80" x2="400" y2="80" stroke="black" stroke-width="1" />
  <line x1="440" y1="355" x2="400" y2="355" stroke="black" stroke-width="1" />
  <line x1="420" y1="80" x2="420" y2="355" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <!-- Adjusted position for xu = 1.1D -->
  <text x="330" y="220" font-family="sans-serif" font-size="16" font-style="italic">x<tspan dy="5" font-size="12">u</tspan><tspan dy="-5"> = 1.1D</tspan></text>

  <!-- ec strain arrow -->
  <line x1="450" y1="70" x2="450" y2="40" stroke="black" stroke-width="1" />
  <line x1="550" y1="70" x2="550" y2="40" stroke="black" stroke-width="1" />
  <line x1="450" y1="50" x2="550" y2="50" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="490" y="40" font-family="sans-serif" font-size="16" font-style="italic">&#949;<tspan dy="5" font-size="12">c</tspan></text>

  <text x="450" y="370" font-family="sans-serif" font-size="16">Strain distribution</text>

  <text x="280" y="395" font-family="sans-serif" font-size="12" fill="#0066cc" font-weight="bold">(Figure NOT to scale)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <!-- Definitions for markers and patterns -->
  <defs>
    <!-- Ground Hatch Pattern -->
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="1.5" />
    </pattern>
    <!-- Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>

  <g transform="translate(50, 20)">
    <!-- Main Beam -->
    <line x1="20" y1="130" x2="380" y2="130" stroke="black" stroke-width="4" />
    
    <!-- Left Support (Pinned) -->
    <polygon points="20,130 10,150 30,150" fill="white" stroke="black" stroke-width="2" />
    <line x1="5" y1="150" x2="35" y2="150" stroke="black" stroke-width="2" />
    <rect x="5" y="150" width="30" height="10" fill="url(#hatch)" />

    <!-- Right Support (Roller) -->
    <circle cx="380" cy="140" r="10" fill="white" stroke="black" stroke-width="2" />
    <line x1="365" y1="150" x2="395" y2="150" stroke="black" stroke-width="2" />
    <rect x="365" y="150" width="30" height="10" fill="url(#hatch)" />

    <!-- Top Ground for Spring -->
    <line x1="170" y1="10" x2="230" y2="10" stroke="black" stroke-width="2" />
    <rect x="170" y="0" width="60" height="10" fill="url(#hatch)" />

    <!-- Spring -->
    <polyline points="200,10 200,30 185,45 215,65 185,85 200,100 200,130" fill="none" stroke="black" stroke-width="2" stroke-linejoin="round" />
    <text x="225" y="60" font-family="serif" font-size="24" font-style="italic">k</text>

    <!-- Center Line down to Mass -->
    <line x1="200" y1="130" x2="200" y2="200" stroke="black" stroke-width="2" />

    <!-- Mass Block -->
    <rect x="160" y="200" width="80" height="40" fill="white" stroke="black" stroke-width="2" />
    <text x="200" y="228" font-family="serif" font-size="24" font-style="italic" text-anchor="middle">m</text>

    <!-- Dimension Lines -->
    <line x1="20" y1="155" x2="20" y2="185" stroke="black" stroke-width="1" />
    <line x1="200" y1="155" x2="200" y2="185" stroke="black" stroke-width="1" />
    <line x1="380" y1="155" x2="380" y2="185" stroke="black" stroke-width="1" />

    <line x1="25" y1="175" x2="195" y2="175" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="205" y1="175" x2="375" y2="175" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)" />

    <text x="110" y="165" font-family="serif" font-size="24" font-style="italic" text-anchor="middle">l</text>
    <text x="290" y="165" font-family="serif" font-size="24" font-style="italic" text-anchor="middle">l</text>
  </g>
</svg>

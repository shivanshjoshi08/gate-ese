<svg width="650" height="250" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250">
  <defs>
    <!-- Hatching pattern for fixed support -->
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="2" />
    </pattern>
    <!-- Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>

  <!-- Fixed Support at P -->
  <line x1="100" y1="110" x2="100" y2="170" stroke="black" stroke-width="3" />
  <rect x="80" y="110" width="20" height="60" fill="url(#hatch)" />

  <!-- Pin support at R -->
  <polygon points="450,140 440,160 460,160" fill="black" />
  <line x1="435" y1="160" x2="465" y2="160" stroke="black" stroke-width="2" />
  <rect x="435" y="160" width="30" height="10" fill="url(#hatch)" />

  <!-- Beam PQRS -->
  <line x1="100" y1="140" x2="550" y2="140" stroke="black" stroke-width="4" />
  
  <!-- Hinge at Q -->
  <circle cx="300" cy="140" r="6" fill="black" stroke="black" stroke-width="2" />

  <!-- Labels P, Q, R, S -->
  <text x="110" y="130" font-family="sans-serif" font-size="20" font-weight="bold">P</text>
  <text x="290" y="130" font-family="sans-serif" font-size="20" font-weight="bold">Q</text>
  <text x="440" y="130" font-family="sans-serif" font-size="20" font-weight="bold">R</text>
  <text x="540" y="130" font-family="sans-serif" font-size="20" font-weight="bold">S</text>

  <!-- Dimension lines -->
  <line x1="100" y1="120" x2="100" y2="80" stroke="black" stroke-width="1" />
  <line x1="300" y1="120" x2="300" y2="80" stroke="black" stroke-width="1" />
  <line x1="450" y1="120" x2="450" y2="80" stroke="black" stroke-width="1" />
  <line x1="550" y1="120" x2="550" y2="80" stroke="black" stroke-width="1" />
  
  <!-- PQ -->
  <line x1="100" y1="100" x2="300" y2="100" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="180" y="90" font-family="sans-serif" font-size="16" font-weight="bold">15 m</text>
  
  <!-- QR -->
  <line x1="300" y1="100" x2="450" y2="100" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="360" y="90" font-family="sans-serif" font-size="16" font-weight="bold">10 m</text>
  
  <!-- RS -->
  <line x1="450" y1="100" x2="550" y2="100" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="480" y="90" font-family="sans-serif" font-size="16" font-weight="bold">5 m</text>

  <text x="260" y="220" font-family="sans-serif" font-size="14" fill="#0066cc" font-weight="bold">(Figure NOT to scale)</text>
</svg>

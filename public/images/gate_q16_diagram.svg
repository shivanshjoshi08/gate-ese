<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground -->
  <line x1="80" y1="180" x2="140" y2="180" stroke="black" stroke-width="2"/>
  <line x1="280" y1="180" x2="340" y2="180" stroke="black" stroke-width="2"/>
  <!-- Ground hatches -->
  <path d="M 85 180 L 75 195 M 95 180 L 85 195 M 105 180 L 95 195 M 115 180 L 105 195 M 125 180 L 115 195 M 135 180 L 125 195" stroke="black" stroke-width="1.5"/>
  <path d="M 285 180 L 275 195 M 295 180 L 285 195 M 305 180 L 295 195 M 315 180 L 305 195 M 325 180 L 315 195 M 335 180 L 325 195" stroke="black" stroke-width="1.5"/>

  <!-- Springs -->
  <path d="M 110 180 L 110 160 L 95 150 L 125 130 L 95 110 L 110 100 L 110 80" fill="none" stroke="black" stroke-width="2"/>
  <path d="M 310 180 L 310 160 L 295 150 L 325 130 L 295 110 L 310 100 L 310 80" fill="none" stroke="black" stroke-width="2"/>
  <text x="75" y="145" font-family="sans-serif" font-size="16" font-weight="bold">K<tspan font-size="12" dy="5">P</tspan></text>
  <text x="335" y="145" font-family="sans-serif" font-size="16" font-weight="bold">K<tspan font-size="12" dy="5">Q</tspan></text>

  <!-- Beam -->
  <rect x="110" y="70" width="200" height="10" fill="black"/>
  <text x="110" y="60" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">P</text>
  <text x="310" y="60" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Q</text>

  <!-- Force -->
  <line x1="176" y1="20" x2="176" y2="65" stroke="black" stroke-width="2"/>
  <polygon points="176,70 171,60 181,60" fill="black"/>
  <text x="176" y="15" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3 kN</text>

  <!-- Dimensions -->
  <line x1="110" y1="190" x2="110" y2="210" stroke="black" stroke-width="1"/>
  <line x1="176" y1="190" x2="176" y2="210" stroke="black" stroke-width="1"/>
  <line x1="310" y1="190" x2="310" y2="210" stroke="black" stroke-width="1"/>
  <line x1="110" y1="200" x2="176" y2="200" stroke="black" stroke-width="1"/>
  <line x1="176" y1="200" x2="310" y2="200" stroke="black" stroke-width="1"/>
  <!-- Dimension slashes -->
  <line x1="105" y1="205" x2="115" y2="195" stroke="black" stroke-width="1.5"/>
  <line x1="171" y1="205" x2="181" y2="195" stroke="black" stroke-width="1.5"/>
  <line x1="305" y1="205" x2="315" y2="195" stroke="black" stroke-width="1.5"/>

  <text x="143" y="215" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1 m</text>
  <text x="243" y="215" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2 m</text>
  <text x="210" y="240" font-family="sans-serif" font-size="12" text-anchor="middle">(Figure NOT to scale)</text>
</svg>
